name: Build Firefox Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firefox:
    name: Build Firefox Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout komf fork
        uses: actions/checkout@v4
        with:
          repository: korason7117/komf
          ref: master
          path: komf-fork

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Strip GPG signing from komf-fork publishing config
        working-directory: komf-fork
        run: |
          sed -i '/signAllPublications()/d' komf-client/build.gradle.kts komf-api-models/build.gradle.kts
          sed -i '/^signing {/,/^}/d' komf-client/build.gradle.kts komf-api-models/build.gradle.kts

      - name: Grant execute permission for gradlew (komf-fork)
        working-directory: komf-fork
        run: chmod +x gradlew

      - name: Publish komf-client to mavenLocal
        working-directory: komf-fork
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Debug published artifacts
        run: find ~/.m2/repository/io/github/snd-r/komf -type f | sort

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Firefox Extension
        run: ./gradlew :komfExtensionFirefox --no-daemon --refresh-dependencies

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: komf-extension-firefox
          path: komelia-komf-extension/app/build/distributions/webextension_prod_firefox.zip
          if-no-files-found: error
